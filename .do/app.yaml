name: malayalam-primer-v1
region: blr

services:
  - name: api
    github:
      branch: main
      deploy_on_push: true
      repo: jessgeo-personal/malayalam-primer-v1
    source_dir: server
    run_command: npm start
    http_port: 5000
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /api
        preserve_path_prefix: true
    health_check:
      http_path: /api/health
      initial_delay_seconds: 15
      period_seconds: 10
    envs:
      - key: MONGO_URI
        type: SECRET
      - key: JWT_SECRET
        type: SECRET
      - key: RESEND_API_KEY
        type: SECRET
      - key: RESEND_FROM_EMAIL
        value: onboarding@resend.dev
      - key: CLIENT_URL
        value: ${APP_URL}
      - key: NODE_ENV
        scope: RUN_TIME
        value: production

static_sites:
  - name: web
    github:
      branch: main
      deploy_on_push: true
      repo: jessgeo-personal/malayalam-primer-v1
    source_dir: client
    build_command: npm run build
    output_dir: dist
    routes:
      - path: /
    catchall_document: index.html
