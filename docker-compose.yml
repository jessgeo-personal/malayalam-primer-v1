version: '3.8'
services:
  mongodb:
    image: mongo:4.4
    container_name: malayalam_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build: ./server
    container_name: malayalam_api
    ports:
      - "5000:5000"
    env_file: .env
    environment:
      - MONGO_URI=mongodb://mongodb:27017/malayalam_decode
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./client
    container_name: malayalam_web
    ports:
      - "${WEB_PORT:-3080}:80" # Nginx serves built app on port 3080 by default (change via WEB_PORT in .env)
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongodb_data:


